<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q4 - Offer Banners</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="q4_banners.js" defer></script>
  <style>
    .banner { padding:16px; margin:8px; background:#dff0d8; border-radius:4px; }
    .controls { margin:10px 0; }
  </style>
</head>
<body>
  <main>
    <h2>Special Offers</h2>
    <div class="controls">
      <button id="hide">Hide</button>
      <button id="show">Show</button>
      <button id="slide-toggle">Slide Up/Down</button>
      <button id="fade-toggle">Fade In/Out</button>
    </div>

    <section id="banners">
      <div class="banner" data-index="1">Banner 1 - 50% off!</div>
      <div class="banner" data-index="2">Banner 2 - Free shipping</div>
      <div class="banner" data-index="3">Banner 3 - Buy 1 Get 1</div>
      <div class="banner" data-index="4">Banner 4 - Limited stock</div>
      <div class="banner" data-index="5">Banner 5 - New arrival</div>
    </section>
  </main>
</body>
</html>
