<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q10 - Registration</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="q10_register.js" defer></script>
  <style>
    .invalid { border: 2px solid red; }
    .success { color: green; }
  </style>
</head>
<body>
  <main>
    <h2>Register</h2>
    <form id="reg-form" novalidate>
      <label>Name: <input id="name" name="name" /></label><br/>
      <label>Email: <input id="email" name="email" /></label><br/>
      <label>Password: <input id="password" name="password" type="password" /></label><br/>
      <button type="submit">Register</button>
      <button type="button" id="check-unique">Check Email Uniqueness</button>
    </form>
    <div id="status"></div>
  </main>
</body>
</html>
