<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q7 - Search Courses</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="q7_courses.js" defer></script>
  <style>
    .course { padding:8px; border-bottom:1px solid #eee; }
    .match { background:#ffffe0; }
  </style>
</head>
<body>
  <main>
    <h2>Courses</h2>
    <input id="search" placeholder="Search courses..." />
    <button id="clear">Clear</button>
    <p>Matches: <span id="count">0</span></p>
    <section id="courses">
      <div class="course">JavaScript Fundamentals</div>
      <div class="course">Advanced CSS Techniques</div>
      <div class="course">React for Beginners</div>
      <div class="course">Data Structures in Java</div>
      <div class="course">Node.js and Express</div>
      <div class="course">Python for Data Science</div>
    </section>
  </main>
</body>
</html>
