<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q1 - Welcome Greeting</title>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="q1_welcome.js" defer></script>
</head>
<body>
  <header>
    <h1 id="greeting">Welcome!</h1>
    <p id="sub">We're glad you are here.</p>
  </header>

  <main>
    <section id="welcome-section">
      <p id="welcome-msg">This is your personalized welcome area.</p>
      <button id="change-greet">Change Greeting</button>
      <button id="toggle-welcome">Toggle Welcome Message</button>
      <button id="show-time">Show Current Time</button>
    </section>

    <aside id="quotes">
      <ul>
        <li>"Keep going — you're doing great."</li>
        <li>"Small steps every day."</li>
        <li>"Progress over perfection."</li>
        <li>"Code, test, ship."</li>
        <li>"Stay curious."</li>
      </ul>
    </aside>
  </main>

  <footer>
    <small>© Example</small>
  </footer>
</body>
</html>
