<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q9 - Multi jQuery</title>
  <!-- Load jQuery v1 for widget1 -->
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script>
    // save v1 to a variable
    var jq1 = jQuery.noConflict(true); // removes v1 from global jQuery/$ and returns it
    window.jq1 = jq1;
  </script>

  <!-- Load jQuery v3 for widget2 -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script>
    // Save v3 as jq3 (keeps global jQuery as v3)
    var jq3 = jQuery.noConflict(true);
    window.jq3 = jq3;
  </script>

  <script src="q9_widgets.js" defer></script>
  <style>
    .widget { border:1px solid #ccc; padding:8px; margin:8px; width:300px; display:inline-block; }
    .active { border-color:blue; }
  </style>
</head>
<body>
  <main>
    <div id="widget1" class="widget">
      <h3>Carousel (v1)</h3>
      <div class="slides">
        <div class="slide">Slide A</div>
        <div class="slide">Slide B</div>
        <div class="slide">Slide C</div>
      </div>
    </div>

    <div id="widget2" class="widget">
      <h3>Modal (v3)</h3>
      <button id="open-modal">Open Modal</button>
      <div id="modal" style="display:none; border:1px solid #000; padding:10px; background:#fff;">Notification Modal <button id="close-modal">Close</button></div>
    </div>
  </main>
</body>
</html>
